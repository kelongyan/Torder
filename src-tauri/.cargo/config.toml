[build]
# windows_raw_dylib: 改用运行时 DLL 导入而非编译时静态符号，
# 显著降低 windows crate 编译阶段的内存占用。
rustflags = ["--cfg", "windows_raw_dylib"]
# sccache 编译缓存：跨增量编译复用依赖产物（本机已安装，D:\cargo\bin\sccache.exe）
rustc-wrapper = "sccache"
# 并行编译任务数：28 物理核全部投入（96GB 内存余量充足，28 个 rustc 峰值约 30-56GB）
jobs = 28
# sccache 自带缓存，rustc 增量编译与缓存互斥，显式关闭（避免重复劳动与缓存失效）
incremental = false

# 网络重试与超时：避免偶发源下载失败打断长编译
[net]
retry = 5
