[package]
name = "torder"
version = "2.4.0"
description = "Torder（今序）本地优先待办桌面应用"
authors = ["Zhaxideler"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "torder_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.40.1", features = ["bundled"] }
uuid = { version = "1.24.0", features = ["v4"] }
chrono = { version = "0.4", features = ["clock", "serde"] }
chrono-tz = "0.10"
tauri-plugin-opener = "2.5.4"
tauri-plugin-notification = "2.3.3"

# 托盘/全局快捷键仅桌面平台可用（Android/iOS 无对应系统 API）
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-global-shortcut = "2"

# Mica 毛玻璃仅 Windows 生效（lib.rs / app.rs 引用均带 cfg(target_os="windows") 保护）
[target.'cfg(target_os = "windows")'.dependencies]
window-vibrancy = "0.6"

[dev-dependencies]
rusqlite = { version = "0.40.1", features = ["bundled"] }
uuid = { version = "1.24.0", features = ["v4"] }

[profile.release]
panic = "abort"
codegen-units = 16
lto = false
opt-level = "s"
strip = true

# windows crate 体量极大，名字解析阶段容易 OOM。
# opt-level=0 让 rustc 早期 pass 跳过大量优化分析，显著降低内存峰值。
# windows API 绑定本质是 FFI，不优化对运行时性能影响可忽略。
[profile.release.package.windows]
opt-level = 0
